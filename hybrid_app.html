<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hybrid</title>
<style>
  :root {
    --page: #f7f6f3; --side: #efede8; --card: #ffffff; --text: #1f1e1c; --muted: #66635d;
    --line: #dcd9d2; --hover: #e8e5de; --accent: #2a63bd; --brand: #b9552f; --on-brand: #ffffff;
    --ok: #2b7a30; --bad: #b3261e; --bubble: #e9e6df; --select: #f3d3c5;
    --shadow: 0 8px 24px rgb(40 30 20 / 0.14), 0 2px 6px rgb(40 30 20 / 0.08);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #1c1b19; --side: #232220; --card: #2a2927; --text: #ecebe7; --muted: #a8a59e;
      --line: #3b3936; --hover: #353330; --accent: #86b4f6; --brand: #d97b57; --on-brand: #1c1b19;
      --ok: #86c98a; --bad: #f2867f; --bubble: #33312e; --select: #6b3a26;
      --shadow: 0 10px 28px rgb(0 0 0 / 0.5), 0 2px 6px rgb(0 0 0 / 0.35);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  ::selection { background: var(--select); color: var(--text); }
  html, body { height: 100%; margin: 0; }
  body { background: var(--page); color: var(--text); font: 15px/1.5 system-ui, "Segoe UI", sans-serif;
         display: grid; grid-template-columns: 256px minmax(0, 1fr); }
  button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line);
           border-radius: 8px; padding: 6px 12px; cursor: pointer;
           transition: background-color 0.15s ease-out, border-color 0.15s ease-out; }
  button:hover { background: var(--hover); }
  button:active { transform: translateY(1px); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2;
          stroke-linecap: round; stroke-linejoin: round; }
  .spin { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } button { transition: none; } }

  aside { background: var(--side); border-right: 1px solid var(--line); display: flex;
          flex-direction: column; min-height: 0; padding: 14px 12px 12px; }
  .brand { font-weight: 600; letter-spacing: -0.01em; padding: 0 6px 12px; }
  #new { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--card); }
  #new:hover { background: var(--hover); }
  #chats { flex: 1; overflow-y: auto; margin: 6px -4px 0; padding: 0 4px; }
  .project { font-size: 12px; color: var(--muted); margin: 18px 6px 4px; overflow-wrap: anywhere; }
  .chat { display: block; width: 100%; text-align: left; border: 0; padding: 7px 8px;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat[aria-current="true"] { background: var(--hover); font-weight: 500; }
  #status { border-top: 1px solid var(--line); padding: 10px 6px 0; font-size: 12px; color: var(--muted);
            display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px;
            font-variant-numeric: tabular-nums; }
  #status span:nth-child(even) { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  main { display: flex; flex-direction: column; min-height: 0; height: 100vh; }
  #thread { flex: 1; overflow-y: auto; padding: 28px 20px 12px; }
  .col { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .user { align-self: flex-end; max-width: 85%; background: var(--bubble); border-radius: 16px 16px 4px 16px;
          padding: 9px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .reply { display: flex; flex-direction: column; gap: 10px; }
  .claude { font-family: Georgia, "Times New Roman", serif; font-size: 16px; line-height: 1.65;
            white-space: pre-wrap; overflow-wrap: anywhere; }
  .who { font-size: 12px; color: var(--muted); margin-bottom: -6px; }
  .note { font-size: 12px; color: var(--muted); }
  .thinking { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .empty { text-align: center; margin: 16vh auto 0; max-width: 42ch; }
  .empty h1 { font-size: 22px; font-weight: 500; letter-spacing: -0.01em; margin: 0 0 8px; text-wrap: balance; }
  .empty p { color: var(--muted); margin: 0 0 20px; text-wrap: pretty; }
  .primary { background: var(--text); color: var(--page); border-color: transparent; font-weight: 500; }
  .primary:hover { background: var(--text); opacity: 0.86; }

  .plan { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 8px 12px; }
  .plan header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 0 6px 8px; }
  .plan header strong { font-weight: 500; }
  .row { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 10px; align-items: center;
         width: 100%; text-align: left; border: 0; border-radius: 6px; padding: 6px; }
  .row .mid { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sum { color: var(--muted); font-size: 13px; margin-left: 8px; }
  .row .right { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .row svg { color: var(--muted); }
  .passed svg { color: var(--ok); }
  .failed svg, .failed .right { color: var(--bad); }
  .running svg, .running .right { color: var(--accent); }
  .detail { margin: 2px 6px 8px 32px; padding: 10px 12px; background: var(--page); border: 1px solid var(--line);
            border-radius: 8px; font: 12px/1.5 Consolas, "Cascadia Mono", monospace; white-space: pre-wrap;
            overflow-wrap: anywhere; max-height: 320px; overflow-y: auto; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 6px 0; }
  .actions:empty { display: none; }

  #composer { padding: 0 20px 14px; }
  #box { max-width: 680px; margin: 0 auto; position: relative; background: var(--card);
         border: 1px solid var(--line); border-radius: 16px; padding: 10px;
         transition: border-color 0.15s ease-out; }
  #box:focus-within { border-color: var(--muted); }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; background: var(--bubble); border-radius: 999px; padding: 2px 2px 2px 10px;
          display: inline-flex; align-items: center; gap: 2px; margin-bottom: 8px; }
  .chip button { border: 0; padding: 4px; border-radius: 999px; display: grid; }
  .chip svg { width: 12px; height: 12px; }
  textarea { display: block; width: 100%; resize: none; border: 0; outline: 0; background: transparent;
             color: inherit; font: inherit; padding: 4px 6px 10px; max-height: 180px; caret-color: var(--brand); }
  textarea::placeholder { color: var(--muted); opacity: 1; }
  #bar { display: flex; align-items: center; gap: 8px; }
  .icon { width: 36px; height: 36px; padding: 0; display: grid; place-items: center; flex: none; }
  #modes { display: flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; }
  #modes button { border: 0; border-radius: 6px; padding: 4px 12px; font-size: 13px; color: var(--muted); }
  #modes button[aria-pressed="true"] { background: var(--bubble); color: var(--text); font-weight: 500; }
  #send { margin-left: auto; background: var(--brand); color: var(--on-brand); border-color: transparent; }
  #send:hover { background: var(--brand); opacity: 0.88; }
  #hint { max-width: 680px; margin: 8px auto 0; padding: 0 6px; font-size: 12px; color: var(--muted); }
  #menu { position: absolute; bottom: 54px; left: 8px; width: 264px; max-height: 300px; overflow-y: auto;
          background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px;
          z-index: 5; box-shadow: var(--shadow); }
  #menu button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; padding: 7px 8px; }
  #menu .label { font-size: 12px; color: var(--muted); padding: 10px 8px 2px; }
  #error { max-width: 680px; margin: 0 auto; padding: 0 6px 6px; color: var(--bad); font-size: 13px; }
  #error:empty { display: none; }
  [hidden] { display: none !important; }

  .setup { margin: 10vh auto 0; max-width: 520px; width: 100%; }
  .setup h1 { font-size: 22px; font-weight: 500; letter-spacing: -0.01em; margin: 0 0 8px; text-wrap: balance; }
  .setup > p { color: var(--muted); margin: 0 0 18px; text-wrap: pretty; }
  .choices { display: flex; flex-direction: column; gap: 8px; border: 0; padding: 0; margin: 0 0 18px; }
  .choice { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; align-items: start;
            background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
  .choice:has(input:checked) { border-color: var(--brand); }
  .choice input { margin: 4px 0 0; accent-color: var(--brand); grid-row: span 2; }
  .choice strong { font-weight: 500; }
  .choice .tag { font-size: 12px; color: var(--brand); margin-left: 8px; }
  .choice .note { grid-column: 2; }
  .setup .actions { padding: 0; }
  a.button { color: inherit; text-decoration: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
  a.button:hover { background: var(--hover); }
  progress { width: 100%; height: 8px; accent-color: var(--brand); margin: 4px 0 8px; }
  .bad { color: var(--bad); font-size: 13px; margin: 0 0 12px; }
  #status .change { border: 0; padding: 0 0 0 6px; font-size: 12px; color: var(--accent); }
  #status .ok { color: var(--ok); }
  #status .connect { border: 0; padding: 0; font-size: 12px; color: var(--bad); text-decoration: none; text-align: left; }
  #status .connect:hover { background: transparent; text-decoration: underline; }

  @media (max-width: 720px) {
    body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 32vh; padding: 10px 12px; }
    .brand { display: none; }
    main { height: auto; min-height: 0; }
    #thread { padding: 18px 14px 8px; }
    #composer { padding: 0 10px 10px; }
    #modes button { padding: 6px 10px; }
  }
</style>
</head>
<body>
<aside>
  <div class="brand">Hybrid</div>
  <button id="new"></button>
  <nav id="chats" aria-label="Chats"></nav>
  <div id="status" aria-live="polite"></div>
</aside>
<main>
  <div id="thread"><div class="col" id="col"></div></div>
  <div id="composer">
    <div id="error" role="alert"></div>
    <div id="box">
      <div id="menu" hidden></div>
      <div id="chips"></div>
      <textarea id="input" rows="1" aria-label="Message" aria-describedby="hint"></textarea>
      <div id="bar">
        <button class="icon" id="attach" aria-label="Attach files, photos or plugins" aria-expanded="false"></button>
        <div id="modes" role="group" aria-label="Who does the work">
          <button data-mode="hybrid">Hybrid</button>
          <button data-mode="claude">Claude</button>
          <button data-mode="local">Local</button>
        </div>
        <button class="icon" id="send" aria-label="Send"></button>
      </div>
      <input type="file" id="file" multiple hidden>
    </div>
    <div id="hint"></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);

// One authored icon set: 24px grid, 2px round strokes. Static markup, never user data.
const ICONS = {
  passed: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  failed: '<path d="M6 6l12 12M18 6L6 18"/>',
  skipped: '<path d="M6 12h12"/>',
  waiting: '<circle cx="12" cy="12" r="7"/>',
  running: '<path d="M12 3a9 9 0 1 0 9 9"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  clip: '<path d="M21 12.5l-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.3-8.3"/>',
  send: '<path d="M12 19V5M5 12l7-7 7 7"/>',
  file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5"/>',
};
function icon(name) {
  const t = document.createElement("template");
  t.innerHTML = `<svg class="i${name === "running" ? " spin" : ""}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
  return t.content.firstChild;
}

const MODES = {
  hybrid: { hint: "Hybrid: Claude plans and writes the tests, then your GPU writes the code.", ask: "Describe what to build or change" },
  claude: { hint: "Claude: Claude makes the change itself. Nothing runs on your GPU.", ask: "Describe what to build or change" },
  local: { hint: "Local: offline chat with your local model. It can't read or change files.", ask: "Ask the local model" },
};

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid);
  return e;
}

async function api(path, body) {
  const opts = body === undefined ? {} : body instanceof Blob ? { method: "POST", body }
    : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

let cur = null, mode = "hybrid", state = null, lastJson = "", lastCount = -1;
let files = [], plugins = [], pluginList = null;
const details = {};   // "plan|task" -> text, for rows the user opened
try { cur = localStorage.getItem("chat"); mode = localStorage.getItem("mode") || mode; } catch (e) {}

function setMode(m) {
  mode = MODES[m] ? m : "hybrid";
  try { localStorage.setItem("mode", mode); } catch (e) {}
  for (const b of $("modes").children) b.setAttribute("aria-pressed", b.dataset.mode === mode);
  $("hint").textContent = MODES[mode].hint;
  $("input").placeholder = MODES[mode].ask;
}

function fail(e) { $("error").textContent = e ? (e.message || String(e)) : ""; }
function act(fn) { return async (...a) => { fail(); try { await fn(...a); await poll(); } catch (e) { fail(e); } }; }

function select(id) {
  cur = id; lastJson = ""; lastCount = -1; files = []; plugins = []; chips();
  try { localStorage.setItem("chat", id); } catch (e) {}
}

const newChat = act(async () => {
  const { path } = await api("/api/pick-folder", {});
  if (!path) return;
  select((await api("/api/new", { project: path })).id);
  $("input").focus();
});

const send = act(async () => {
  if (!cur) throw new Error("Start a chat first: New chat, then pick a project folder");
  await api("/api/chat", { chat: cur, text: $("input").value, files, plugins, mode });
  $("input").value = ""; grow(); files = []; plugins = []; chips();
});

function chips() {
  $("chips").replaceChildren(
    ...files.map((f, i) => chip(f.name, () => { files.splice(i, 1); chips(); })),
    ...plugins.map((p, i) => chip("plugin: " + p, () => { plugins.splice(i, 1); chips(); })));
}
function chip(label, remove) {
  return h("span", { class: "chip" }, label,
    h("button", { "aria-label": "Remove " + label, onclick: remove }, icon("failed")));
}

async function toggleMenu() {
  const menu = $("menu"), open = menu.hidden;
  menu.hidden = !open; $("attach").setAttribute("aria-expanded", open);
  if (!open) return;
  menu.replaceChildren(
    h("button", { onclick: () => { toggleMenu(); $("file").click(); } }, icon("file"), "Files and photos"),
    h("div", { class: "label" }, pluginList ? "Plugins" : "Loading plugins…"));
  if (!pluginList) { try { pluginList = await api("/api/plugins"); } catch (e) { pluginList = []; } }
  if (menu.hidden) return;
  menu.lastChild.textContent = pluginList.length ? "Plugins" : "No plugins installed";
  menu.append(...pluginList.map(p => h("button", { onclick: () => {
    if (!plugins.includes(p)) plugins.push(p);
    chips(); toggleMenu(); $("input").focus();
  } }, p)));
}

const upload = act(async () => {
  if (!cur) throw new Error("Start a chat first: New chat, then pick a project folder");
  for (const f of $("file").files) {
    files.push(await api(`/api/upload?chat=${cur}&name=${encodeURIComponent(f.name)}`, f));
    chips();
  }
  $("file").value = "";
});

async function toggleDetail(plan, id) {
  const key = plan + "|" + id;
  if (key in details) delete details[key];
  else {
    try { details[key] = (await api(`/api/task?plan=${encodeURIComponent(plan)}&id=${encodeURIComponent(id)}`)).text; }
    catch (e) { return fail(new Error("Nothing is recorded for this task until it finishes")); }
    fail();
  }
  lastJson = ""; render();
}

let loginStarted = false;  // a sign-in window is open; cleared once Claude reports connected
const connectClaude = act(async () => { await api("/api/claude-login", {}); loginStarted = true; lastJson = ""; });

// First-run setup: pick the local model. setup is /api/setup, loaded only while the screen shows.
let setup = null, setupOpen = false, pick = null;
const gb = bytes => (bytes / 1e9).toFixed(1);
function openSetup() { setupOpen = true; setup = null; pick = null; poll(); }
function closeSetup() { setupOpen = false; setup = null; pick = null; lastJson = ""; }

const chooseModel = act(async () => {
  setup = await api("/api/setup", { model: pick });
  if (setup.done && setup.model === pick && !setup.pull.model) closeSetup();  // was already installed
});

function setupScreen() {
  const s = setup, col = $("col");
  if (!s) return col.replaceChildren(h("div", { class: "setup thinking" }, icon("running"), "Checking your computer…"));
  if (!s.ollama) return col.replaceChildren(h("div", { class: "setup" },
    h("h1", {}, "One thing to install first"),
    h("p", {}, "This app runs AI on your own computer with a free program called Ollama. Install it, open it once, then come back here."),
    h("div", { class: "actions" },
      h("a", { class: "button", href: "https://ollama.com/download", target: "_blank", rel: "noopener" }, "Get Ollama"),
      h("button", { class: "primary", onclick: act(async () => { setup = await api("/api/setup"); }) }, "Check again"))));
  const p = s.pull;
  if (p.model && !p.error) return col.replaceChildren(h("div", { class: "setup", "aria-live": "polite" },
    h("h1", {}, "Downloading " + p.model),
    h("p", {}, "This happens once. You can leave this page open and do something else."),
    h("progress", { max: p.total || 1, value: p.done }),
    h("p", { class: "note" }, p.total ? `${gb(p.done)} of ${gb(p.total)} GB` : "Starting…")));

  const choice = c => {
    const have = s.installed.includes(c.model);
    return h("label", { class: "choice" },
      h("input", { type: "radio", name: "model", value: c.model, checked: c.model === pick,
                   onchange: () => { pick = c.model; lastJson = ""; render(); document.querySelector("input[name=model]:checked").focus(); } }),
      h("span", {}, h("strong", {}, c.model), c.model === s.recommended && h("span", { class: "tag" }, "Recommended")),
      h("span", { class: "note" }, c.note + " " + (have ? "Already on this computer." : `Download: about ${c.gb} GB.`)));
  };
  const chosen = s.choices.find(c => c.model === pick);
  const have = s.installed.includes(pick);
  col.replaceChildren(h("div", { class: "setup" },
    h("h1", {}, s.done ? "Change the AI on your computer" : "Choose the AI that runs on your computer"),
    h("p", {}, s.gpu
      ? `We found your graphics card: ${s.gpu.name} with ${s.gpu.gb} GB of memory. We picked the model that fits it best.`
      : "We didn't find an NVIDIA graphics card, so the AI will run on your processor. That works, but it is slower."),
    h("fieldset", { class: "choices" }, h("legend", { hidden: true }, "Model"), s.choices.map(choice)),
    p.error && h("p", { class: "bad", role: "alert" }, p.error),
    h("div", { class: "actions" },
      h("button", { class: "primary", onclick: chooseModel },
        have ? "Use this one" : `Download and use (about ${chosen ? chosen.gb : "?"} GB)`),
      s.done && h("button", { onclick: () => { closeSetup(); render(); } }, "Cancel"))));
}

function planCard(p) {
  const done = p.tasks.filter(t => t.status === "passed").length;
  const failed = p.tasks.some(t => t.status === "failed" || t.status === "skipped");
  const label = { ready: "Ready to run", running: `Running on your GPU, ${done} of ${p.tasks.length} done`,
                  done: `${done} of ${p.tasks.length} passed`, stopped: "Stopped" }[p.state];
  const rows = p.tasks.flatMap(t => {
    const key = p.path + "|" + t.id;
    const right = ["waiting", "running", "skipped"].includes(t.status) ? t.status
      : `${t.status}, ${t.seconds} s` + (t.attempts > 1 ? `, ${t.attempts} tries` : "");
    return [
      h("button", { class: "row " + t.status, "aria-expanded": key in details, onclick: () => toggleDetail(p.path, t.id) },
        icon(t.status),
        h("span", { class: "mid" }, t.id, h("span", { class: "sum" }, t.summary)),
        h("span", { class: "right" }, right)),
      key in details && h("div", { class: "detail" }, details[key])];
  });
  const actions = [];
  if (p.state === "ready") actions.push(state.running
    ? h("span", { class: "note" }, "Another run is using the GPU")
    : h("button", { class: "primary", onclick: act(() => api("/api/run", { chat: cur, plan: p.path })) }, "Run on your GPU"));
  if (p.state === "running") actions.push(h("button", { onclick: act(() => api("/api/stop", {})) }, "Stop"));
  if ((p.state === "done" || p.state === "stopped") && (failed || p.state === "stopped") && !state.chat.busy)
    actions.push(h("button", { onclick: act(() => api("/api/chat", { chat: cur, fix: p.path })) }, "Ask Claude to fix failures"));
  if (p.branch && p.state !== "running") actions.push(h("span", { class: "note" }, "Changes are on branch " + p.branch));
  return h("section", { class: "plan", "aria-label": "Plan" },
    h("header", {}, h("strong", {}, `Plan: ${p.tasks.length} ${p.tasks.length === 1 ? "task" : "tasks"}`), h("span", { class: "note" }, label)),
    rows, h("div", { class: "actions" }, actions));
}

function render() {
  if (state.claude.connected) loginStarted = false;
  const json = JSON.stringify([state, Object.keys(details), setup, pick, setupOpen, loginStarted]);
  if (json === lastJson) return;
  lastJson = json;

  const groups = {};
  for (const c of state.chats) (groups[c.project] = groups[c.project] || []).push(c);
  $("chats").replaceChildren(...Object.entries(groups).flatMap(([project, list]) => [
    h("div", { class: "project", title: project }, project.split(/[\\/]/).pop() || project),
    ...list.map(c => h("button", { class: "chat", "aria-current": c.id === cur, onclick: () => { select(c.id); poll(); } }, c.title))]));
  const c = state.claude;
  $("status").replaceChildren(
    h("span", {}, "Claude"), h("span", {}, c.connected
      ? h("span", { class: "ok" }, "Connected" + (c.plan ? ` (${c.plan[0].toUpperCase() + c.plan.slice(1)})` : ""))
      : !c.installed
        ? h("a", { class: "connect", href: "https://claude.com/claude-code", target: "_blank", rel: "noopener" }, "Not installed · Get it")
        : loginStarted
          ? h("button", { class: "connect", onclick: connectClaude, title: "Open the sign-in window again" }, "Finish signing in, in the new window")
          : h("button", { class: "connect", onclick: connectClaude }, "Not connected · Connect")),
    h("span", {}, "Local model"), h("span", {}, state.model,
      state.setup && !setupOpen && h("button", { class: "change", onclick: openSetup }, "Change")),
    h("span", {}, "GPU memory"), h("span", {}, state.status.gpu));

  const inSetup = !state.setup || setupOpen;
  $("composer").hidden = inSetup;
  if (inSetup) return setupScreen();

  const chat = state.chat, col = $("col");
  if (!chat) {
    col.replaceChildren(h("div", { class: "empty" },
      h("h1", {}, "Plan with Claude, build on your GPU"),
      h("p", {}, "Pick a project folder to start. Claude writes the tests and a plan, and your local model does the coding."),
      h("button", { class: "primary", onclick: newChat }, "Pick a project folder")));
    return;
  }
  const kids = chat.messages.map(m => m.role === "user"
    ? h("div", { class: "user" }, m.text,
        (m.files.length || m.plugins.length) ? h("div", { class: "note" }, [...m.files, ...m.plugins.map(p => "plugin: " + p)].join(", ")) : null)
    : h("div", { class: "reply" },
        m.by && h("div", { class: "who" }, m.by === "local" ? "Local model" : "Claude, direct edit"),
        h("div", { class: "claude" }, m.text), m.plan && planCard(m.plan)));
  if (!chat.messages.length) kids.push(h("p", { class: "note" }, "Project: " + chat.project));
  if (chat.busy) kids.push(h("div", { class: "thinking" }, icon("running"), chat.busy + " is thinking…"));
  col.replaceChildren(...kids);
  const count = chat.messages.length + (chat.busy ? 1 : 0);
  if (count !== lastCount) { lastCount = count; $("thread").scrollTop = $("thread").scrollHeight; }
}

async function poll() {
  try {
    state = await api("/api/state" + (cur ? "?chat=" + cur : ""));
    if (cur && !state.chat) cur = null;
    if ((!state.setup || setupOpen) && (!setup || setup.pull.model)) {  // refresh while downloading
      const s = await api("/api/setup");
      if (setup && setup.pull.model && !s.pull.model && s.done) closeSetup();  // download finished
      else { setup = s; pick = pick || s.recommended; }
      state.setup = s.done; state.model = s.model;
    }
    render();
  } catch (e) { fail(new Error("Can't reach the app server. Is hybrid_app.py still running?")); }
}

function grow() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 180) + "px"; }

$("new").append(icon("plus"), "New chat");
$("attach").append(icon("clip"));
$("send").append(icon("send"));
$("new").addEventListener("click", newChat);
$("send").addEventListener("click", send);
$("attach").addEventListener("click", toggleMenu);
$("modes").addEventListener("click", e => { if (e.target.dataset.mode) setMode(e.target.dataset.mode); });
$("file").addEventListener("change", upload);
$("input").addEventListener("input", grow);
$("input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("menu").hidden) { toggleMenu(); $("attach").focus(); } });
setMode(mode);
poll();
setInterval(poll, 1500);
</script>
</body>
</html>
